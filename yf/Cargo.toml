[package]
name = "yf"
version = "0.5.0"
edition = "2021"
description = "Yoshiko Flow CLI: install, upgrade, verify, and preflight portable agent skills."
license = "MIT"
authors = ["James Dixson <dixson3@gmail.com>"]
repository = "https://github.com/dixson3/yoshiko-flow"
homepage = "https://github.com/dixson3/yoshiko-flow"

[features]
# Bake the `skills/` tree into DEBUG builds too (plan-041, #137).
#
# `rust-embed` is declared WITHOUT `debug-embed`, so a debug binary resolves embedded
# paths from `skills/` ON DISK at runtime. That is a deliberate development-loop trade —
# a skills edit costs no recompile — but it means `cargo test` exercises the ON-DISK tree
# and never the BAKED one, so the whole embed surface (including REQ-YF-EMBED-003's
# frontmatter integrity check) asserts against something the shipped binary does not use.
# It also means the debug binary does not satisfy REQ-YF-EMBED-001/-002 ("from the binary
# alone"); §3.2's profile carve-out records that, and names THIS feature as how
# conformance is demonstrated.
#
# OPT-IN ON PURPOSE — do not flip it on by default. Measured (plan-041 E3): enabling it
# breaks zero tests but costs the zero-rebuild skills-edit loop (~1.3 s per edit) and
# imports the REQ-YF-EMBED-004 addition defect into the dev loop, since that defect is
# profile-independent. CI runs one job with it enabled; local development keeps the fast
# default.
embed-in-debug = ["rust-embed/debug-embed"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Pure-Rust .tar.gz extraction for `yf self update` (plan-018 3.4a). flate2's
# default `miniz_oxide` backend is pure Rust — no C zlib, and no system tar/xz
# (the GNU-tar-needs-xz landmine the .tar.gz flip in 1.2 avoids).
flate2 = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
# Trivia-preserving TOML editing for the codex `config.toml` delta-replay tune path
# (REQ-YF-TUNE-013). Retains comments, key order, and formatting a from-scratch
# `serde_json::Value` reserialization would destroy.
toml_edit = "0.22"
# Minimal synchronous HTTP for `yf self update` (plan-018 3.4). ureq + rustls — no
# async runtime (decision 6: NOT reqwest/tokio), keeping the binary small (GR-011).
ureq = { version = "2", features = ["tls"], default-features = false }
# Atomic in-place replacement of the running binary (3.4).
self-replace = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
