# CI workflow for the `yf` crate — SPEC.md §5 (verification).
#
# Consolidates Issue 4.3 (initial CI scaffold) + Issue 6.4 (meaningful test
# suite) — this is the REQ-coverage CI surface. Runs the quality gates on every
# pull request and on pushes to `main`: formatting (`cargo fmt --all --check`),
# lints (`cargo clippy --workspace --all-targets -D warnings`, so test code is
# linted too), and the full crate test suite (`cargo test --workspace`, which
# covers frontmatter/closure parity, marker/tree-hash/prune, dest, preflight
# 3-state parity, beads-init verify classifier, and migrate). The workspace
# embeds `skills/` via rust-embed at build time, so the default full-repo
# checkout is sufficient — no submodule handling needed.
#
# This is distinct from `release.yml` (which runs on `v*` tags to build/publish
# the release matrix); this file owns the per-PR/per-push verification gate.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  baked-embed:
    # Exercise the SHIPPING embed path (plan-041, #137).
    #
    # `rust-embed` is declared without `debug-embed`, so the `test` job above builds
    # DEBUG and every embed assertion — including REQ-YF-EMBED-003's frontmatter
    # integrity check and the enumeration tests — reads `skills/` FROM DISK. They
    # therefore assert against the repo checkout, never the payload a released binary
    # actually carries. This job enables the opt-in `embed-in-debug` feature so those
    # same tests assert against the BAKED tree, which is how REQ-YF-EMBED-001/-002/-003
    # conformance is demonstrated (see SPEC.md §3.2's profile carve-out).
    #
    # HONEST SCOPE: this job canNOT catch a #137-class defect. #137 is an
    # INCREMENTAL-rebuild bug, and CI builds clean every run — `actions/checkout@v4`
    # gives fresh mtimes and `Swatinem/rust-cache@v2` prunes workspace crate artifacts,
    # so the embed is always freshly baked here. A clean build cannot exhibit an
    # incremental staleness bug. The guard against #137 is the addition-propagation
    # test (`yf/tests/embed_addition.rs`, REQ-YF-EMBED-004), which runs in the job
    # above. What THIS job buys is closing a spec-conformance hole, which is a real but
    # different claim.
    #
    # The `yf/` prefix on the feature is a package-qualified name, unambiguous at the
    # virtual workspace root; `-p yf --features embed-in-debug` is the equivalent form.
    name: baked embed conformance (embed-in-debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test against the baked embed tree
        run: cargo test --workspace --features yf/embed-in-debug

  web-doc-checks:
    # THE COVERAGE THAT BINDS OUTSIDE THE yf-plan LAND PATH (plan-066, #317).
    #
    # CHANGE-VALIDATION.md's FULL tier IS mechanically enforced — `_validate_merged` returns
    # fail/exit 3 — but it binds on the yf-plan LAND PATH ONLY, and the FAST on-edit trigger is
    # itself an always-loaded prose rule. Measured (plan-066 EXP-002), that is the class that
    # produced 4 firing opportunities and 0 catches. Without this job a direct, non-plan commit
    # to `web/content/`, `README.md` or `yf/src/harness_desc.rs` gets nothing at all — which is
    # exactly how commit 75a5796 shipped a twentieth skill, broke the site build, and drifted
    # the 19->20 skill count with no CI surface that would ever have noticed.
    #
    # NO `paths:` FILTER, DELIBERATELY. `ci.yml` runs unfiltered on every PR and every push to
    # `main`, so a filtered job would give strictly LESS coverage than the file it lives in. The
    # source side matters as much as the doc side here: an absent skill page is never edited and
    # can never fire its own on-edit check.
    #
    # The four checkers are invoked BY NAME rather than by a `check_web_*` glob, because
    # `check_skill_page_contract.py` does not carry that prefix and a glob would silently drop
    # it — the third of four, and the one that guards the defect that broke the build.
    name: web/doc drift checkers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Counted-set claims (skills, groups, formulas)
        run: uv run scripts/checks/check_web_counts.py

      - name: Harness path / name_transform claims
        run: uv run scripts/checks/check_web_harness_paths.py

      - name: Skill-page existence (set difference)
        run: uv run scripts/checks/check_skill_page_contract.py

      - name: Upstream-backend claims
        run: uv run scripts/checks/check_web_backend_claim.py

      # A checker never observed to fail is not evidence. This runs the code-side controls, so
      # CI would catch a checker that has quietly stopped attributing anything — the failure
      # mode measured twice in this plan, both times in the direction that looks like success.
      - name: Negative controls (every checker must be observed to FAIL)
        run: uv run scripts/checks/test_negative_controls.py --all --min-checkers 4

      - name: DRIFT-CHECK.md referential closure
        run: uv run scripts/checks/check_drift_manifest_closure.py
