# CI workflow for the `yf` crate — SPEC.md §5 (verification).
#
# Consolidates Issue 4.3 (initial CI scaffold) + Issue 6.4 (meaningful test
# suite) — this is the REQ-coverage CI surface. Runs the quality gates on every
# pull request and on pushes to `main`: formatting (`cargo fmt --all --check`),
# lints (`cargo clippy --workspace --all-targets -D warnings`, so test code is
# linted too), and the full crate test suite (`cargo test --workspace`, which
# covers frontmatter/closure parity, marker/tree-hash/prune, dest, preflight
# 3-state parity, beads-init verify classifier, and migrate). The workspace
# embeds `skills/` via rust-embed at build time, so the default full-repo
# checkout is sufficient — no submodule handling needed.
#
# This is distinct from `release.yml` (which runs on `v*` tags to build/publish
# the release matrix); this file owns the per-PR/per-push verification gate.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  baked-embed:
    # Exercise the SHIPPING embed path (plan-041, #137).
    #
    # `rust-embed` is declared without `debug-embed`, so the `test` job above builds
    # DEBUG and every embed assertion — including REQ-YF-EMBED-003's frontmatter
    # integrity check and the enumeration tests — reads `skills/` FROM DISK. They
    # therefore assert against the repo checkout, never the payload a released binary
    # actually carries. This job enables the opt-in `embed-in-debug` feature so those
    # same tests assert against the BAKED tree, which is how REQ-YF-EMBED-001/-002/-003
    # conformance is demonstrated (see SPEC.md §3.2's profile carve-out).
    #
    # HONEST SCOPE: this job canNOT catch a #137-class defect. #137 is an
    # INCREMENTAL-rebuild bug, and CI builds clean every run — `actions/checkout@v4`
    # gives fresh mtimes and `Swatinem/rust-cache@v2` prunes workspace crate artifacts,
    # so the embed is always freshly baked here. A clean build cannot exhibit an
    # incremental staleness bug. The guard against #137 is the addition-propagation
    # test (`yf/tests/embed_addition.rs`, REQ-YF-EMBED-004), which runs in the job
    # above. What THIS job buys is closing a spec-conformance hole, which is a real but
    # different claim.
    #
    # The `yf/` prefix on the feature is a package-qualified name, unambiguous at the
    # virtual workspace root; `-p yf --features embed-in-debug` is the equivalent form.
    name: baked embed conformance (embed-in-debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test against the baked embed tree
        run: cargo test --workspace --features yf/embed-in-debug
