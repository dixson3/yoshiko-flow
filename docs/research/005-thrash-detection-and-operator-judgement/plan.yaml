topic: "Detecting agentic thrash: signals that a plan needs operator judgement, and the clarifying-question taxonomy that breaks the loop (design basis for yf-judgement)"
mode: deep
priority: 1
research_dir: "docs/research/005-thrash-detection-and-operator-judgement"

questions:
  primary:
    - "What OBSERVABLE signals precede an agentic thrash episode — repeated review passes re-raising the same concern, re-litigated decisions, oscillating fixes — and which of them are detectable EARLY enough to be worth acting on?"
    - "Is the hypothesis true: does thrashing correlate with an under-specified objective (over-general goal / assumed 'figure it out') rather than with task difficulty, tooling failure, or model limitation? What would REFUTE it?"
    - "When an episode DID break, what broke it? Specifically: what class of operator-supplied information (constraint, priority, exclusion, intent, authority) ended it, and can that class be elicited by a question asked BEFORE the burn?"
  secondary:
    - "What question taxonomies does prior art use (grill-me, socrates-skill), and which of their moves map onto a plan/execution context vs. assume a conversational one?"
    - "What are the FALSE-POSITIVE costs? Legitimate iteration and productive deepening look like repetition. What discriminates thrash from convergence?"
    - "At which yf surfaces could a detector actually fire (review-pass loop, coordinator loop, bead reopen, plan revision), and what does each surface see?"

