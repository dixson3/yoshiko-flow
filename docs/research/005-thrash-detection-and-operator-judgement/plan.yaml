tooling_needed:
  - description: "Thrash-episode extractor: parse reviews/pass-N.md sequences per bundle, fingerprint each finding, detect the SAME concern recurring across passes; join to git history and bead graphs; emit candidate episodes with evidence"
    shared: false

method_notes:
  - "004 is the direct predecessor and its boundary is the starting constraint: it found that plan bundles record ARTIFACTS, not live session behavior — thrashing happens in a session and leaves only indirect residue. 005 must reason from residue (recurring findings, bead reopens, revision oscillation) and say so, not pretend to observe the loop directly."
  - "The hypothesis is the operator's own and is therefore the thing most at risk of being confirmed rather than tested. Assign the red-team pass explicitly to the RIVAL explanations: task difficulty, missing tool/permission, context exhaustion, genuine underdetermination in the domain. A signal that cannot distinguish these is not a signal."
  - "Survivorship: episodes that ended without an operator turn (the agent just got there) are the control group and must be sampled, or every finding reduces to 'operator input helps'."
  - "yoshiko-flow is self-referential (the skill fixing itself). A pattern also present in writing/ or emacs.d — non-software, low-ceremony domains — is materially stronger."
  - "Prior art to study: https://github.com/mattpocock/skills/tree/main/skills/productivity (grill-me) and https://github.com/bevibing/socrates-skill."

