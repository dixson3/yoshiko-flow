# CORPUS CORRECTION (recorded 2026-08-28, tooling phase; see artifacts/tooling-notes.md).
# The `corpus:` table above was measured with a scan that double-counted `.worktrees/<branch>/`
# mirrors of docs/plans in yoshiko-flow, d3-pxe and evri_py (86 of the 391 counted review files
# were worktree duplicates). corpus_scan.py excludes `.worktrees` and measures the CORRECTED
# baseline: 114 plan bundles / 301 review passes. All downstream phases cite corpus_scan.py
# output, NOT the `corpus:` block above.
corpus_corrected:
  measured_by: "scripts/corpus_scan.py"
  bundles: 114
  review_passes: 301
  # FILE-SET DEFINITION (reconciled 2026-08-28 against an independent operator recount of 305).
  # A "review pass" is: any *.md file directly inside a `reviews/` directory of a REAL plan
  # bundle. Triangulate and every downstream phase inherit THIS definition.
  file_set_definition:
    glob: "<bundle>/reviews/*.md"
    includes:
      # Both scripts glob `pass-*.md` and derive the pass number with re.search(r"pass-(\d+)"),
      # so `pass-0-conformance.md` matches and is parsed as pass 0. Conformance passes are NOT
      # dropped. compute_recurrence() re-sorts numerically by pass_number (finding_recurrence.py
      # L406), so the lexical glob order does not corrupt pass-10..13 in plan-050 (the 13-pass
      # bundle, the corpus maximum).
      - "pass-N.md (299 files)"
      - "pass-N-conformance.md (2 files: d3-pxe Incubator/ansible plan-013, plan-014)"
    excludes:
      - path: ".worktrees/<branch>/**"
        count: 86
        why: "checked-out-branch mirrors of docs/plans; duplicates of files already counted"
      - path: "docs/plans/plan-029-james-dixson-75fd34/findings/okf-migration-samples/plan-bundle/{before,after}/reviews/pass-{1,2}.md"
        count: 4
        why: "SYNTHETIC OKF-migration sample fixtures authored AS plan-029's research data, not
               real review passes of a real plan. Their parent dirs are named before/after, not
               plan-*. Including them would treat a plan's own test fixture as evidence."
    reconciliation: "305 files under any reviews/ dir (worktrees excluded) - 4 plan-029 fixtures = 301."

