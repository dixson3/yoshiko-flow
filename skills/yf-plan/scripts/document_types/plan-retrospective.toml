# plan-retrospective.md — the stop/deviation corpus written DURING execution (Issue 2.6).
#
# Only 3 files: the emit surface shipped recently. Measured 0% drift. The type is declared
# now, while the corpus is small and uniform, precisely so the schema constrains the corpus
# as it grows rather than being retrofitted to whatever it becomes.
type = "plan-retrospective"
producer_class = "code-generated"
derive_from = "plan_template.RETROSPECTIVE_SECTIONS"
description = "A yf-plan bundle's plan-retrospective.md: append-only stop and deviation entries."

paths = [
    "docs/plans/*/plan-retrospective.md",
    "Incubator/*/plans/*/plan-retrospective.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

# `regex-present`, NOT `headings-any-level` — and the reason is a real trap, measured:
# `doc_lint.sections()` returns only `##`/`###` headings and NEVER an `H1`. A schema that
# checks an H1 title via `headings-any-level` reports it missing on EVERY file, forever.
# This schema did exactly that until SC6 caught it. `_shared/test_doc_lint.py` now pins the
# limitation so the next schema author meets it as a test rather than as a mystery.
#
# `derive_from` above is retained: it records that the title is a PRODUCER literal
# (`retrospective-append` writes it) and the loader requires it for a code-generated type.
# Measured 3/3, so `E` is safe on the REQ-DATA-045 evidence standard.
[[checks]]
id = "retrospective-heading"
severity = "E"
kind = "regex-present"
pattern = '(?m)^# +Plan retrospective'

# `RE-NNN` ids are append-only and never renumbered. A file with no entry id at all is
# either empty or has lost its structure.
# `R`, not `W`: entries are appended DURING execution, and `STATUS_SEVERITY` promotes
# `W -> E` at `review`. See the shared rule stated in `review.toml`.
[[checks]]
id = "entry-ids"
severity = "R"
kind = "regex-present"
pattern = '(?m)^#{1,3} +RE-[0-9]+'

# --- plan-052 Issue 5.3 (#196): structured prevention fields --------------------------
#
# `prevention` STAYS PROSE and is deliberately NOT checked here. A prevention narrative is a
# human judgement, and mechanizing it would produce fake entries — the same reasoning that
# makes `manual:` a first-class disposition in REQ-DATA-070 rather than a failure.
#
# What IS checkable is the FORMULA NAME: an identifier with a closed domain (`bd formula
# list`), where an unchecked typo silently prevents nothing. `retrospective_fields.py
# --check-formula` owns that check; this schema only records that the two fields are
# recognized, so a reader meeting the document meets the convention too.
#
# Report-only (`R`): a retrospective is a historical record, and an entry written before these
# fields existed must not be re-judged by a rule added after it.
[[checks]]
id = "prevention-formula-shape"
severity = "R"
kind = "regex-absent"
# A `prevention_formula:` line whose value is empty or a placeholder. The DOMAIN check is the
# executable one; this only catches a field that was added and then left blank.
pattern = "(?m)^[-*]?\\s*\\*{0,2}prevention_formula\\*{0,2}\\s*:\\s*(?:$|_?TBD_?|N/?A|-{1,2}\\s*$)"
message = "prevention_formula is present but empty — validate the name with `retrospective_fields.py --check-formula <name>`, or omit the field"
