# references/upstream-<N>.md — CODE-GENERATED by `_write_upstream_reference` (Issue 2.3).
#
# 194 files. This is the one type in the corpus with a real code producer, so the schema is
# DERIVED from that producer's constants rather than restated. A restated copy is a second
# source of truth: it drifts the moment the producer changes, and nothing detects it.
#
# GLOB NARROWED to `upstream-[0-9]*.md`. The parent `references/*.md` tree also holds
# hand-authored notes, comment drafts and vendored content, which this producer did not
# write and this schema must not judge (Issue 2.8 splits those out).
type = "upstream-reference"
producer_class = "code-generated"
derive_from = "plan_template.UPSTREAM_REFERENCE_SECTIONS"
description = "A yf-plan upstream-issue reference generated by `_write_upstream_reference` (full untruncated issue body)."

paths = [
    "docs/plans/*/references/upstream-[0-9]*.md",
    "Incubator/*/plans/*/references/upstream-[0-9]*.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

# No `value` — resolved from `derive_from` at run time.
#
# SEVERITY `R`, and the reason is MEASURED, not cautious: the glob's population is MIXED.
# 9 of 194 `upstream-<N>.md` files were HAND-AUTHORED — they follow the producer's naming
# convention but were never written by `_write_upstream_reference` (plan-047's
# `upstream-175.md`, the coarse tracker, is one). Nothing in the PATH distinguishes them
# from generated files, so a check that assumes the producer wrote every matching file is
# asserting something the filename cannot support. Reporting the divergence is honest;
# failing on it would penalize a human for writing a note where a generator usually writes.
[[checks]]
id = "required-sections"
severity = "R"
kind = "headings-any-level"

# The metadata block the producer writes above `## Body`. These files are regenerated on
# every re-triage, so a missing field means the file predates the current producer.
# `R`, not `W`: `W` becomes `E` at `review`, and these are written at TRIAGE (scoping) and
# regenerated on re-triage. Measured: 16 of 194 predate the current producer.
[[checks]]
id = "metadata-block"
severity = "R"
kind = "regex-present"
pattern = '(?m)^- \*\*Number:\*\* '

# TEETH. Measured 194/194 carry a heading. Without an `E` the type could not fail at all.
[[checks]]
id = "has-heading"
severity = "E"
kind = "regex-present"
pattern = '(?m)^#{1,2} +\S'

# --- plan-056 Issue 3.3 / REQ-DATA-075: the `description:` PRODUCER CONTRACT --------------
#
# `W`, NOT `E`, and paired with a `regex-present` pattern rather than a bare key-presence
# check. Both choices are load-bearing:
#
#   * `regex-present` `^description:\s*\S` — a `key-present` check is satisfied by
#     `description:` with an EMPTY value, which is the producer stamping the key and no
#     content. That is the "asserting something nothing checks" failure one level down, and
#     it is the exact shape `REQ-OKF-011` refuses when it says a generated index entry must
#     never invent a placeholder.
#
#   * `W` because REQ-DATA-075 is enforced AT THE PRODUCER. This check is a hit-rate lever
#     over the residue an older producer left, not the enforcement point — and re-measured
#     2026-08-28, that residue is the MAJORITY of nested files (804 of 993, and falling as
#     the producer stamps them). An `E` would hard-fail every
#     bundle authored before the producer fix, which is D-1's forward-only principle
#     violated by the very requirement that states it.
#
# `research-*` TYPES ARE SCOPED OUT — declared here, and stated because omitting it silently
# would be the same defect. Their `bundle_status` is `None`, so `STATUS_SEVERITY` returns `{}`
# (REQ-DATA-045) and a `W` there is PERMANENT: never promoted at `review`, never demoted at
# `complete`. A permanent warning is noise, not enforcement, and noise is what trains a reader
# to stop looking at warnings.
[[checks]]
id = "description"
severity = "W"
kind = "regex-present"
pattern = '^description:\s*\S'
