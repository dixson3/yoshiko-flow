# upstream-triage.md — the triage record behind plan.md's Upstream Issues table (Issue 2.6).
#
# 30 files, measured at 0% drift on the checks below. CODE-GENERATED by `plan_manager.py`'s
# triage verb, so the header line is a producer literal and the type derives nothing it
# could restate wrongly.
#
# The `deferred` literal was added to the generated header by Issue 0.2 — this check pins
# that the producer keeps offering the full disposition alphabet. Without it the literal is
# undiscoverable to the agent that would use it (SC9).
type = "upstream-triage"
producer_class = "agent-written"
description = "A yf-plan bundle's upstream-triage.md: per-issue disposition decisions and reasoning."

paths = [
    "docs/plans/*/upstream-triage.md",
    "Incubator/*/plans/*/upstream-triage.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

[[checks]]
id = "triage-heading"
severity = "E"
kind = "regex-present"
pattern = '(?m)^# Upstream Issue Triage:'

# `R`, NOT `W`. The original `W` reasoning was right about the cause and wrong about the
# mechanism: `STATUS_SEVERITY` promotes `W -> E` at `review`, so a `W` here still fails the
# whole corpus at exactly the gate it was meant to survive. SC6 caught it.
#
# All 30 historical triage files were generated BEFORE Issue 0.2 added `deferred`, so every
# one carries the four-option header. `R` reports the producer-version gap without failing a
# bundle for a change made after its file was written — REQ-DATA-045's reasoning applied on
# the TIME axis rather than the path axis.
[[checks]]
id = "disposition-alphabet-offered"
severity = "R"
kind = "regex-present"
pattern = 'include, exclude, partial, supersede, deferred'
# plan-049 Issue 4.7 (REQ-DATA-058). RE-SCOPED, not retired.
#
# MEASURED, twice: this rule fired on **30 of the 31** selected files — and the one
# non-firing file was the triage of the plan doing the measuring. A rule that fires on
# essentially everything is a CONSTANT, and a constant carries zero information no matter what
# severity it wears; `R` only made it quieter.
#
# The cause is not that 30 triage documents are wrong. It is that this asserts something the
# CURRENT `triage` producer emits, against 30 documents an OLDER producer wrote. That is a
# producer-version check, and re-judging finished documents by it teaches nobody anything.
#
# So it now applies only to IN-FLIGHT bundles, where the current producer is the one that
# wrote the file and where an author can still act on the finding. Retiring it outright would
# have thrown away a real signal for new triage documents; this keeps the signal and drops the
# noise.
statuses = ["scoping", "investigating", "drafting", "review", "ready-for-approval"]

