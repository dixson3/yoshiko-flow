# references/* — STRUCTURAL EXCLUSION (plan-047 Issue 2.4 / REQ-DATA-027).
#
# 206 `.md` files, overwhelmingly VENDORED VERBATIM (upstream issue bodies, third-party
# specs) or generated by `_write_upstream_reference`. Linting vendored content against an
# authored template would be wrong — so this type declares NO type-schema checks at all.
# The tree is still reachable by the GFM-validity axis (yf-markdown-lint), which is a
# different linter on a different axis.
#
# The one thing enforced here is the marker itself: a file that IS vendored must SAY so,
# because an absent marker is what makes the carve-out undetectable. That check is scoped
# to the directories where vendored copies actually live, so it cannot fire on the 154
# generated upstream-issue references.
type = "reference"
producer_class = "agent-written"
description = "A yf-plan bundle reference: generated upstream-issue body, hand-authored note, or vendored external content."

paths = [
    "docs/plans/*/references/user-scope/**/*.md",
    "Incubator/*/plans/*/references/user-scope/**/*.md",
]
exclude = [
    "skills/**/fixtures/**",
]

[[checks]]
id = "vendored-marker"
severity = "E"
kind = "frontmatter-keys"
# REQ-DATA-027: unmarked vendored content is an ERROR, not a silent pass. The marker IS
# the exclusion predicate, so an exclusion that nothing declares is a hole.
value = ["source", "retrieved"]
