# docs/research/*/Summary.md — the research report's top-level synthesis (Issue 2.7).
#
# EVERY CHECK IS `W`, per D-10 / REQ-DATA-045. `docs/research/**` is OUTSIDE a plan bundle,
# so `bundle_status` is null, `STATUS_SEVERITY` returns `{}`, and an `E` would stay `E`
# with NO softening available for the life of the repo. There is no status escape hatch off
# the plan-bundle axis — the single largest hidden cost in the type work, and the reason
# every research check here is a warning even where the corpus currently passes 4/4.
#
# Measured 2026-08-19: `## Executive summary` present in 4/4. It is STILL `W`: the corpus
# is four files, and a rule declared `E` against a four-file corpus is one new research
# project away from a repo-wide hard failure with no migration window.
type = "research-summary"
producer_class = "agent-written"
description = "A yf-research project's Summary.md: the synthesized, citation-backed report."

paths = [
    "docs/research/*/Summary.md",
    "Incubator/*/research/*/Summary.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

[[checks]]
id = "executive-summary"
severity = "W"
kind = "headings-any-level"
value = ["Executive summary"]

# The epistemic rule yf-research mandates: absence is a valid finding, and it must be
# STATED rather than left implicit. 3 of 4 carry a section naming what was not established.
[[checks]]
id = "absence-declared"
severity = "W"
kind = "regex-present"
pattern = '(?im)^#{1,3} .*(not established|could not establish|absence)'
