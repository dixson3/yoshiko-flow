# references/upstream-<N>.md — CODE-GENERATED by `_write_upstream_reference` (Issue 2.3).
#
# 194 files. This is the one type in the corpus with a real code producer, so the schema is
# DERIVED from that producer's constants rather than restated. A restated copy is a second
# source of truth: it drifts the moment the producer changes, and nothing detects it.
#
# GLOB NARROWED to `upstream-[0-9]*.md`. The parent `references/*.md` tree also holds
# hand-authored notes, comment drafts and vendored content, which this producer did not
# write and this schema must not judge (Issue 2.8 splits those out).
type = "upstream-reference"
producer_class = "code-generated"
derive_from = "plan_template.UPSTREAM_REFERENCE_SECTIONS"
description = "A yf-plan upstream-issue reference generated by `_write_upstream_reference` (full untruncated issue body)."

paths = [
    "docs/plans/*/references/upstream-[0-9]*.md",
    "Incubator/*/plans/*/references/upstream-[0-9]*.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

# No `value` — resolved from `derive_from` at run time.
[[checks]]
id = "required-sections"
severity = "E"
kind = "headings-any-level"

# The metadata block the producer writes above `## Body`. These files are regenerated on
# every re-triage, so a missing field means the file predates the current producer.
[[checks]]
id = "metadata-block"
severity = "W"
kind = "regex-present"
pattern = '(?m)^- \*\*Number:\*\* '
