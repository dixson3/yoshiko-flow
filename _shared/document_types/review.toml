# reviews/*.md — the red-team / conformance pass reports (plan-048 Issue 2.2).
#
# MEASURED over 119 files (2026-08-19, re-measured per D-5 rather than inherited):
#
#   Verdict line          114/119   95.8%
#   ## Concerns           112/119   94.1%
#   ## Gate Assessment    110/119   92.4%
#   ## Upstream Assessment 109/119  91.6%
#   ## Strengths          108/119   90.8%
#   ## Missing            100/119   84.0%
#   Resolutions table      24/119   20.2%
#
# The five body sections and the Verdict line ship at `E`; the Resolutions table at `W`.
# That split is not a guess about importance — it is the measurement. A check landing at
# `E` against 84-96% conformance leaves a real but bounded residue that STATUS_SEVERITY
# absorbs (every non-conforming file sits in a `complete` bundle, hence REPORT-only). The
# Resolutions table at 20.2% would put four fifths of the corpus in error state, and an
# `E` nothing can satisfy trains authors to fake the shape rather than fix it.
#
# These files ARE inside plan bundles, so `bundle_status` resolves and REQ-DATA-045's
# no-`E`-off-the-plan-axis constraint does not bite here. The enforcement point is a plan
# at `review` / `ready-for-approval`, which is exactly when a review report is being written.
type = "review"
producer_class = "agent-written"
description = "A yf-plan red-team or conformance review pass report (`reviews/pass-N.md`)."

paths = [
    "docs/plans/*/reviews/*.md",
    "Incubator/*/plans/*/reviews/*.md",
]
exclude = [
    "skills/**/fixtures/**",
    "tests/fixtures/**",
]

# `headings-any-level` because the corpus splits between H2 and H3 for the body sections
# (8 files use `### Gate Assessment`). The level carries no meaning here; the section's
# PRESENCE does. Requiring H2 specifically would fail 8 files for a formatting choice.
# SEVERITY `R`, NOT `E` — the rule plan-048 Issue 2.9 established, applied consistently.
#
# THE RULE: a document type whose files are AUTHORED DURING the plan phase at which the
# linter BINDS cannot carry a promotable severity for content shape. `STATUS_SEVERITY`
# promotes `W -> E` at `review`/`ready-for-approval` — and a review pass report is written
# precisely while the plan sits at `review`. So an `E` (or a `W`, which IS an `E` there)
# fires on the document being authored at that very moment, and on every earlier report
# written under an earlier convention. Measured: 97 of 119 carry all five sections, 95 in
# order — forcing the other 22 would fail a real bundle at its own gate.
#
# The same reasoning covers `finding` (written during execution) and `plan-retrospective`
# (appended during execution). It does NOT cover `context` or `upstream-triage`, which are
# written at init/scoping — BEFORE the gate — and are correctly `E`.
[[checks]]
id = "required-sections"
severity = "R"
kind = "headings-any-level"
value = ["Strengths", "Concerns", "Missing", "Gate Assessment", "Upstream Assessment"]

# The verdict is the whole point of the document: it drives the phase transition and the
# REQ-PLAN-030 re-review rule. A review whose verdict cannot be read mechanically cannot
# be counted by `ready-check`.
# `R` for the same reason. Measured 114/119.
[[checks]]
id = "verdict-declared"
severity = "R"
kind = "regex-present"
pattern = '(?m)^#{1,6} +Verdict: +(APPROVE|REVISE|INVESTIGATE-MORE)\b|^\*\*Verdict:\*\* *(APPROVE|REVISE|INVESTIGATE-MORE)\b'

# SKILL.md mandates a per-concern Resolutions table with an `actor` column (renamed from
# "Operator Resolutions", which asserted a fixed resolver the autonomous loop contradicts).
# W, not E: measured 20.2%.
# `R`, not `W`: at `review` a `W` IS an `E`, and `review` is the one status in which every
# review report is being written. Measured 24/119.
[[checks]]
id = "resolutions-table"
severity = "R"
kind = "regex-present"
pattern = '(?m)^\| *Concern *\|'

# The type's TEETH. Measured 119/119 — every review report carries a `#` or `##` heading.
# Without an `E` the type could not fail at all, which is R4's defect class ("a check that
# ships unable to fail"), so moving the content checks to `R` REQUIRED adding this one.
[[checks]]
id = "has-heading"
severity = "E"
kind = "regex-present"
pattern = '(?m)^#{1,2} +\S'

# --- plan-056 Issue 3.3 / REQ-DATA-075: the `description:` PRODUCER CONTRACT --------------
#
# `W`, NOT `E`, and paired with a `regex-present` pattern rather than a bare key-presence
# check. Both choices are load-bearing:
#
#   * `regex-present` `^description:\s*\S` — a `key-present` check is satisfied by
#     `description:` with an EMPTY value, which is the producer stamping the key and no
#     content. That is the "asserting something nothing checks" failure one level down, and
#     it is the exact shape `REQ-OKF-011` refuses when it says a generated index entry must
#     never invent a placeholder.
#
#   * `W` because REQ-DATA-075 is enforced AT THE PRODUCER. This check is a hit-rate lever
#     over the residue an older producer left, not the enforcement point — and re-measured
#     2026-08-28, that residue is the MAJORITY of nested files (804 of 993, and falling as
#     the producer stamps them). An `E` would hard-fail every
#     bundle authored before the producer fix, which is D-1's forward-only principle
#     violated by the very requirement that states it.
#
# `research-*` TYPES ARE SCOPED OUT — declared here, and stated because omitting it silently
# would be the same defect. Their `bundle_status` is `None`, so `STATUS_SEVERITY` returns `{}`
# (REQ-DATA-045) and a `W` there is PERMANENT: never promoted at `review`, never demoted at
# `complete`. A permanent warning is noise, not enforcement, and noise is what trains a reader
# to stop looking at warnings.
[[checks]]
id = "description"
severity = "W"
kind = "regex-present"
pattern = '^description:\s*\S'

# --- plan-059 Issue 1.4 / REQ-DATA-076: the severity vocabulary pin -----------------------
#
# `R`, and the severity is the whole design rather than a hedge. The census behind
# REQ-DATA-076 measured **45 distinct severity tokens** across the live corpus, so an `E`
# would fail essentially every historical review bundle. A `W` is no better: `STATUS_SEVERITY`
# promotes `W -> E` at `review`/`ready-for-approval`, which is exactly the status at which a
# review report is authored — this file's own rule, stated above and applied unchanged.
#
# `section = "Concerns"` and `column = "Severity"`, and the column is located BY HEADER NAME.
# The corpus writes `## Concerns` with three, four and five columns and the severity column
# sits at a different index in each; a positional read would report findings about prose.
#
# The token set is NOT written here. It is read from `spec/data.md`'s marker line, because
# REQ-DATA-076 makes the ratified list a declared fact rather than an implementer's choice —
# a set hard-coded in this file would drift from the ratification on its first amendment and
# nothing would report the divergence.
[[checks]]
id = "cell-vocabulary"
severity = "R"
kind = "cell-vocabulary"
section = "Concerns"
column = "Severity"
vocabulary_file = "spec/data.md"
vocabulary_marker = "Ratified severity vocabulary: "
